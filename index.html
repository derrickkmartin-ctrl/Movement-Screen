<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Movement Screen">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.json">
<title>Movement Screen</title>
<style>
:root {
  --bg:       #0f0f0f;
  --surf:     #1a1a1a;
  --surf2:    #242424;
  --surf3:    #2e2e2e;
  --ink:      #f0ede8;
  --ink2:     #a09a92;
  --ink3:     #5a5550;
  --accent:   #c8b89a;
  --teal:     #7ec8b8;
  --orange:   #e8906a;
  --red:      #e06868;
  --green:    #7ec898;
  --amber:    #e8b86a;
  --purple:   #b89ae8;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.14);
  --r:        14px;
  --rsm:      8px;
  --sans:     -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  --mono:     'SF Mono', 'Fira Code', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }

/* ── LAYOUT ── */
#app { height: 100dvh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; position: relative; }

/* ── TOP BAR ── */
.topbar {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 52px 20px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.topbar-title { font-size: 17px; font-weight: 600; letter-spacing: -.2px; }
.topbar-step  { font-size: 12px; color: var(--ink3); font-family: var(--mono); }
.settings-btn { background: none; border: none; color: var(--ink2); font-size: 22px; cursor: pointer; padding: 4px; }

/* ── PROGRESS BAR ── */
.progress-wrap { flex-shrink: 0; height: 3px; background: var(--surf2); }
.progress-fill { height: 100%; background: var(--teal); transition: width .3s ease; }

/* ── SCROLL AREA ── */
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 24px 20px 120px; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 12px 20px max(20px, env(safe-area-inset-bottom));
  background: linear-gradient(transparent, var(--bg) 30%);
  display: flex; gap: 10px;
}
.btn-back { flex: 0 0 52px; background: var(--surf2); border: none; border-radius: var(--rsm); color: var(--ink2); font-size: 20px; cursor: pointer; }
.btn-next { flex: 1; background: var(--teal); border: none; border-radius: var(--rsm); color: #0a2820; font-size: 15px; font-weight: 700; padding: 14px; cursor: pointer; letter-spacing: -.1px; }
.btn-next:disabled { background: var(--surf3); color: var(--ink3); }
.btn-generate { flex: 1; background: var(--accent); border: none; border-radius: var(--rsm); color: #1a1200; font-size: 15px; font-weight: 700; padding: 14px; cursor: pointer; }

/* ── SECTION LABELS ── */
.section-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); margin-bottom: 10px; }
.screen-title  { font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 4px; }
.screen-sub    { font-size: 14px; color: var(--ink2); margin-bottom: 24px; line-height: 1.5; }

/* ── FIELD ── */
.field { margin-bottom: 20px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: var(--ink2); margin-bottom: 7px; }
.field input, .field textarea {
  width: 100%; background: var(--surf); border: 1px solid var(--border2);
  border-radius: var(--rsm); color: var(--ink); font-size: 15px; font-family: var(--sans);
  padding: 11px 14px; outline: none;
}
.field textarea { min-height: 72px; resize: none; line-height: 1.5; }
.field input:focus, .field textarea:focus { border-color: var(--teal); }

/* ── CHIP GROUPS ── */
.chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.chip {
  background: var(--surf2); border: 1px solid var(--border2);
  border-radius: 20px; padding: 7px 14px;
  font-size: 13px; color: var(--ink2); cursor: pointer; user-select: none;
  transition: all .15s;
}
.chip.on-clean   { background: rgba(126,200,152,.15); border-color: var(--green);  color: var(--green);  }
.chip.on-comp    { background: rgba(232,184,106,.15); border-color: var(--amber);  color: var(--amber);  }
.chip.on-dysfunc { background: rgba(224,104,104,.15); border-color: var(--red);    color: var(--red);    }
.chip.on-flag    { background: rgba(184,154,232,.15); border-color: var(--purple); color: var(--purple); }
.chip.on-info    { background: rgba(200,184,154,.15); border-color: var(--accent); color: var(--accent); }
.chip.on-goal    { background: rgba(126,200,184,.18); border-color: var(--teal);   color: var(--teal);   }
.chip.on-goal.maxed { opacity: .4; }

/* ── FINDING CARDS ── */
.finding-card {
  background: var(--surf); border: 1px solid var(--border2);
  border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px;
}
.finding-name { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.severity-row { display: flex; gap: 8px; }
.sev-btn {
  flex: 1; background: var(--surf2); border: 1px solid var(--border2);
  border-radius: var(--rsm); padding: 8px 4px; font-size: 12px; font-weight: 600;
  cursor: pointer; text-align: center; color: var(--ink3); transition: all .15s;
}
.sev-btn.active-clean   { background: rgba(126,200,152,.18); border-color: var(--green);  color: var(--green);  }
.sev-btn.active-comp    { background: rgba(232,184,106,.18); border-color: var(--amber);  color: var(--amber);  }
.sev-btn.active-dysfunc { background: rgba(224,104,104,.18); border-color: var(--red);    color: var(--red);    }

/* ── NOTES ── */
.notes-field {
  width: 100%; background: var(--surf2); border: 1px solid var(--border);
  border-radius: var(--rsm); color: var(--ink2); font-size: 13px; font-family: var(--sans);
  padding: 10px 13px; outline: none; resize: none; margin-top: 10px;
  min-height: 54px; line-height: 1.4;
}
.notes-field:focus { border-color: var(--border2); color: var(--ink); }

/* ── CALLOUT ── */
.callout {
  background: rgba(126,200,184,.08); border: 1px solid rgba(126,200,184,.2);
  border-radius: var(--rsm); padding: 12px 14px; margin-bottom: 16px; font-size: 13px;
  color: var(--ink2); line-height: 1.5;
}
.callout.warn { background: rgba(232,144,106,.08); border-color: rgba(232,144,106,.2); }

/* ── RESULT TABS ── */
.result-tabs { display: flex; gap: 2px; background: var(--surf2); border-radius: var(--rsm); padding: 3px; margin-bottom: 20px; }
.result-tab  { flex: 1; padding: 8px 4px; text-align: center; font-size: 12px; font-weight: 600; border-radius: var(--rsm); cursor: pointer; color: var(--ink3); transition: all .2s; }
.result-tab.active { background: var(--surf3); color: var(--ink); }
.result-panel { display: none; }
.result-panel.active { display: block; }
.result-text { font-size: 14px; line-height: 1.7; color: var(--ink2); white-space: pre-wrap; }
.result-text strong { color: var(--ink); font-weight: 600; }
.action-row { display: flex; gap: 10px; margin-top: 20px; }
.action-btn { flex: 1; background: var(--surf2); border: 1px solid var(--border2); border-radius: var(--rsm); padding: 12px; font-size: 13px; color: var(--ink2); cursor: pointer; text-align: center; }
.action-btn.primary { background: var(--teal); color: #0a2820; font-weight: 700; border: none; }

/* ── SETTINGS OVERLAY ── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 100; display: none; align-items: flex-end; }
.overlay.open { display: flex; }
.overlay-panel { background: var(--surf); border-radius: var(--r) var(--r) 0 0; padding: 24px 20px max(28px, env(safe-area-inset-bottom)); width: 100%; }
.overlay-title { font-size: 17px; font-weight: 700; margin-bottom: 20px; }
.overlay-close { float: right; background: none; border: none; color: var(--ink2); font-size: 22px; cursor: pointer; }

/* ── SPINNER ── */
.spinner { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--ink2); font-size: 14px; }
.spin { width: 20px; height: 20px; border: 2px solid var(--surf3); border-top-color: var(--teal); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── DIVIDER ── */
.divider { height: 1px; background: var(--border); margin: 20px 0; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <div class="topbar-step" id="stepLabel">Step 1 of 8</div>
      <div class="topbar-title" id="screenTitle">Client Info</div>
    </div>
    <button class="settings-btn" onclick="openSettings()">⚙︎</button>
  </div>
  <div class="progress-wrap"><div class="progress-fill" id="progressBar" style="width:12.5%"></div></div>
  <div class="scroll" id="scrollArea"></div>
  <div class="bottom-nav" id="bottomNav">
    <button class="btn-back" id="btnBack" onclick="prevStep()">←</button>
    <button class="btn-next" id="btnNext" onclick="nextStep()">Continue</button>
  </div>
</div>

<!-- Settings overlay -->
<div class="overlay" id="settingsOverlay" onclick="closeSettings()">
  <div class="overlay-panel" onclick="e=>e.stopPropagation()">
    <button class="overlay-close" onclick="closeSettings()">×</button>
    <div class="overlay-title">Settings</div>
    <div class="field">
      <label>Anthropic API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-...">
    </div>
    <button class="btn-next" onclick="saveKey()">Save Key</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="matrix-data.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// DATA MODEL
// ═══════════════════════════════════════════════════════════════════

// State
const state = {
  step: 0,
  client: { name: '', date: '', history: '', goals: [], goalOther: '', flags: [], flagOther: '', complaints: '' },
  slsEnabled: false,
  screens: {}, // { findingName: { severity: 'clean'|'comp'|'dysfunc', notes: '' } }
  result: { corrective: '', flags: '', summary: '' },
};

// ── SCREEN DEFINITIONS ────────────────────────────────────────────
// Each finding name EXACTLY matches a Clinical Decision Matrix row
const SCREENS = [
  // Step 0 — Client info (handled separately)

  { // Step 1
    id: 'posture',
    title: 'Standing Posture',
    subtitle: 'Static assessment. Observe from front, side, and behind. Client stands naturally — do not cue corrections.',
    findings: [
      'Forward head posture',
      'Rounded shoulders / protracted scapulae',
      'Thoracic kyphosis',
      'Anterior pelvic tilt',
      'Knee hyperextension',
      'Foot overpronation / arch collapse',
    ],
    conditional: false,
  },
  { // Step 2
    id: 'ohs',
    title: 'Overhead Squat',
    subtitle: '5 reps, bodyweight, arms overhead. Observe from front and side. Generate hypotheses only — run clearance tests before prescribing.',
    findings: [
      'Arms fall forward',
      'Excessive forward lean',
      'Knee valgus',
      'Heel rise',
    ],
    conditional: false,
  },
  { // Step 3 — optional, off by default
    id: 'sls',
    title: 'Single Leg Squat',
    subtitle: '5 reps each side. Observe from front. Compare L/R. Hip drop >5° or knee past midline = clinically significant.',
    findings: [
      'Ipsilateral hip drop',
      'Knee valgus on descent',
      'Trunk lateral flexion',
    ],
    conditional: true,
    trigger: () => state.slsEnabled,
    slsGate: true,
  },
  { // Step 4
    id: 'push',
    title: 'Push Pattern',
    subtitle: 'Assess with push-up or wall push-up. Observe scapular behaviour, shoulder elevation, elbow angle, wrist alignment, and bilateral symmetry.',
    findings: [
      'Scapular winging',
      'Shoulder elevation',
      'Elbow flare > 75°',
      'Wrist deviation under load',
      'Asymmetrical press',
    ],
    conditional: false,
  },
  { // Step 5
    id: 'pull',
    title: 'Pull Pattern',
    subtitle: 'Band or cable row at moderate resistance. Observe scapular timing, upper trap, end-range retraction, bicep engagement, and cervical position.',
    findings: [
      'Upper trap dominant',
      'Limited shoulder extension',
      'Bicep dominance',
      'Cervical protrusion on row',
    ],
    conditional: false,
  },
  { // Step 6
    id: 'hinge',
    title: 'Hip Hinge',
    subtitle: 'Bodyweight dowel hinge — 3-point contact (head, thoracic, sacrum). Observe from side. Note setup symmetry BEFORE movement begins.',
    findings: [
      'Lumbar flexion / rounding',
      'Knee dominant pattern',
      'Hip shift / asymmetry',
      'Lateral setup asymmetry',
      'Hyperextension at top',
    ],
    conditional: false,
  },
  { // Step 7 — Conditional
    id: 'cervical',
    title: 'Cervical Screen',
    subtitle: 'Run if: FHP present, client reports neck pain/headaches, or cervical protrusion observed on pull screen. STOP if arm tingling, dizziness, or bilateral symptoms appear.',
    findings: [
      'Cervical rotation restriction',
      'Cervical flexion/extension restriction',
    ],
    conditional: true,
    trigger: () => {
      const triggers = ['Forward head posture', 'Cervical protrusion on row'];
      return triggers.some(f => state.screens[f]);
    },
    callout: { type: 'warn', text: '🛑 RED FLAG: Stop and refer immediately if any finding reproduces arm pain, tingling, dizziness, or bilateral upper extremity symptoms.' },
  },
  { // Step 8 — Conditional
    id: 'shoulder',
    title: 'Shoulder Mobility',
    subtitle: 'Run if: rounded shoulders, arms fall on OHS, shoulder history on intake, or asymmetrical push/pull observed.',
    findings: [
      'GIRD — glenohumeral internal rotation deficit',
      'Limited overhead reach',
    ],
    conditional: true,
    trigger: () => {
      const triggers = ['Rounded shoulders / protracted scapulae', 'Arms fall forward', 'Elbow flare > 75°', 'Asymmetrical press'];
      return triggers.some(f => state.screens[f]);
    },
  },
];

const TOTAL_STEPS = 9; // 0=client, 1-6=core, 7=cervical, 8=shoulder, 9=results
let activeStep = 0; // 0-indexed into the flow

// ═══════════════════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════════════════

function render() {
  const scroll = document.getElementById('scrollArea');
  const stepLabel = document.getElementById('stepLabel');
  const screenTitle = document.getElementById('screenTitle');
  const bottomNav = document.getElementById('bottomNav');
  const progress = document.getElementById('progressBar');

  progress.style.width = `${((activeStep + 1) / (TOTAL_STEPS + 1)) * 100}%`;
  scroll.scrollTop = 0;

  if (activeStep === 0) {
    stepLabel.textContent = 'Step 1 of 9';
    screenTitle.textContent = 'Client Info';
    scroll.innerHTML = renderClientStep();
    bottomNav.innerHTML = `
      <button class="btn-back" style="display:none" onclick="prevStep()">←</button>
      <button class="btn-next" onclick="nextStep()">Begin Assessment →</button>
    `;
  } else if (activeStep <= 8) {
    const screen = SCREENS[activeStep - 1];
    stepLabel.textContent = `Step ${activeStep + 1} of 9`;
    screenTitle.textContent = screen.title;
    scroll.innerHTML = renderScreenStep(screen);
    bottomNav.innerHTML = `
      <button class="btn-back" onclick="prevStep()">←</button>
      <button class="btn-next" onclick="nextStep()">Continue →</button>
    `;
  } else {
    // Results
    stepLabel.textContent = 'Results';
    screenTitle.textContent = 'Screen Output';
    scroll.innerHTML = renderResults();
    bottomNav.innerHTML = `
      <button class="btn-back" onclick="prevStep()">← Back</button>
      <button class="btn-next" onclick="startOver()">New Screen</button>
    `;
  }
}

function renderClientStep() {
  const c = state.client;

  const GOALS = [
    'Lose body fat', 'Build strength', 'Build muscle', 'Improve mobility',
    'Reduce pain', 'Improve posture', 'Athletic performance', 'General fitness',
    'Post-rehab return', 'Stress & recovery',
  ];

  const FLAGS = [
    'Tight hips', 'Knee pain', 'Achilles / ankle issues', 'Shoulder pain',
    'Low back pain', 'Neck pain', 'Hypermobility (hEDS/HSD)',
    'Post-surgical', 'Acute pain today', 'Osteoporosis',
  ];

  const selectedGoals = c.goals || [];
  const selectedFlags = c.flags || [];

  return `
    <div class="section-label">Client Details</div>
    <div class="field">
      <label>Client Name</label>
      <input type="text" id="c_name" value="${c.name}" placeholder="Full name" oninput="state.client.name=this.value">
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="c_date" value="${c.date || new Date().toISOString().slice(0,10)}" oninput="state.client.date=this.value">
    </div>
    <div class="field">
      <label>Training History</label>
      <input type="text" id="c_hist" value="${c.history}" placeholder="e.g. 2 years casual, just running" oninput="state.client.history=this.value">
    </div>

    <div class="divider"></div>
    <div class="section-label">Primary Goals <span style="color:var(--ink3);font-weight:400;text-transform:none;letter-spacing:0;font-size:11px">— pick top 3</span></div>
    <p style="font-size:13px;color:var(--ink3);margin-bottom:12px;">${selectedGoals.length}/3 selected</p>
    <div class="chip-group">
      ${GOALS.map(g => {
        const on = selectedGoals.includes(g);
        const maxed = !on && selectedGoals.length >= 3;
        return `<div class="chip ${on ? 'on-goal' : ''} ${maxed ? 'maxed' : ''}" data-goal="${g}">${g}</div>`;
      }).join('')}
    </div>
    <div class="field">
      <label style="font-size:12px">Other goal (optional)</label>
      <input type="text" id="c_goal_other" value="${c.goalOther || ''}" placeholder="Describe..." oninput="state.client.goalOther=this.value">
    </div>

    <div class="divider"></div>
    <div class="section-label">Symptom Flags <span style="color:var(--ink3);font-weight:400;text-transform:none;letter-spacing:0;font-size:11px">— select all that apply</span></div>
    <div class="chip-group">
      ${FLAGS.map(f => {
        const on = selectedFlags.includes(f);
        return `<div class="chip ${on ? 'on-flag' : ''}" data-flag="${f}">${f}</div>`;
      }).join('')}
    </div>
    <div class="field">
      <label style="font-size:12px">Other (optional)</label>
      <input type="text" id="c_flag_other" value="${c.flagOther || ''}" placeholder="Any other relevant flags..." oninput="state.client.flagOther=this.value">
    </div>

    <div class="divider"></div>
    <div class="section-label">Chief Complaint / Notes</div>
    <div class="field">
      <textarea id="c_complaints" placeholder="Pain location, symptoms, anything relevant..." oninput="state.client.complaints=this.value">${c.complaints}</textarea>
    </div>

    <div class="divider"></div>
    <div class="section-label">Assessment Options</div>
    <div class="finding-card" style="display:flex;align-items:flex-start;gap:14px;cursor:pointer" id="sls-toggle-card">
      <div style="flex:1">
        <div style="font-size:14px;font-weight:600;margin-bottom:4px">Include Single Leg Squat screen</div>
        <div style="font-size:12px;color:var(--ink3);line-height:1.5">Off by default. The SLS isolates unilateral hip/knee stability deficits invisible in bilateral screening — but requires the client to balance on one leg. Enable for clients who are able and willing.</div>
      </div>
      <div style="flex-shrink:0;margin-top:2px">
        <div style="width:44px;height:26px;border-radius:13px;background:${state.slsEnabled ? 'var(--teal)' : 'var(--surf3)'};position:relative;transition:background .2s" id="sls-track">
          <div style="position:absolute;top:3px;left:${state.slsEnabled ? '21px' : '3px'};width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s"></div>
        </div>
      </div>
    </div>
  `;
}

function renderScreenStep(screen) {
  let html = '';

  html += `<p class="screen-sub">${screen.subtitle}</p>`;

  if (screen.callout) {
    html += `<div class="callout ${screen.callout.type === 'warn' ? 'warn' : ''}">${screen.callout.text}</div>`;
  }

  if (screen.conditional && screen.trigger && !screen.trigger()) {
    html += `<div class="callout">This screen was not triggered by earlier findings. You can still run it manually if clinically indicated.</div>`;
  }

  html += `<div class="section-label">Findings</div>`;
  html += `<p style="font-size:13px;color:var(--ink3);margin-bottom:14px;">Tap a finding to mark it. Then rate severity: <span style="color:var(--green)">✓ Clean</span> · <span style="color:var(--amber)">~ Compensating</span> · <span style="color:var(--red)">✗ Dysfunctional</span></p>`;

  screen.findings.forEach((finding, idx) => {
    const sel = state.screens[finding];
    const isSelected = !!sel;
    html += `
      <div class="finding-card">
        <div class="finding-name" data-idx="${idx}" data-screen="${screen.id}" data-action="toggle" style="cursor:pointer">
          ${isSelected ? `<span style="color:var(--teal)">●</span>` : `<span style="color:var(--ink3)">○</span>`}
          &nbsp;${finding}
        </div>
        ${isSelected ? `
          <div class="severity-row">
            <button class="sev-btn ${sel.severity === 'clean' ? 'active-clean' : ''}" data-idx="${idx}" data-screen="${screen.id}" data-action="severity" data-sev="clean">✓ Clean</button>
            <button class="sev-btn ${sel.severity === 'comp' ? 'active-comp' : ''}" data-idx="${idx}" data-screen="${screen.id}" data-action="severity" data-sev="comp">~ Compensating</button>
            <button class="sev-btn ${sel.severity === 'dysfunc' ? 'active-dysfunc' : ''}" data-idx="${idx}" data-screen="${screen.id}" data-action="severity" data-sev="dysfunc">✗ Dysfunctional</button>
          </div>
          <textarea class="notes-field" placeholder="Notes (optional)..." data-idx="${idx}" data-screen="${screen.id}" data-action="note">${sel.notes || ''}</textarea>
        ` : ''}
      </div>
    `;
  });

  // Screen-level notes
  html += `
    <div class="divider"></div>
    <div class="section-label">Screen Notes</div>
    <textarea class="notes-field" style="min-height:72px" placeholder="General observations for this screen..." data-screen-id="${screen.id}">${(state.screenNotes || {})[screen.id] || ''}</textarea>
  `;

  // Last screen — show Generate button
  if (activeStep === 8) {
    html += `
      <div class="divider"></div>

// INTERACTIONS

function toggleGoal(g) {
  const goals = state.client.goals;
  const i = goals.indexOf(g);
  if (i > -1) {
    goals.splice(i, 1);
  } else if (goals.length < 3) {
    goals.push(g);
  }
  render();
}

function toggleClientFlag(f) {
  const i = state.client.flags.indexOf(f);
  if (i > -1) state.client.flags.splice(i, 1);
  else state.client.flags.push(f);
  render();
}

function toggleFinding(finding) {
  if (state.screens[finding]) {
    delete state.screens[finding];
  } else {
    state.screens[finding] = { severity: 'comp', notes: '' };
  }
  render();
}

function setSeverity(finding, sev) {
  if (state.screens[finding]) state.screens[finding].severity = sev;
  render();
}

function setNote(finding, val) {
  if (state.screens[finding]) state.screens[finding].notes = val;
}

function bindDelegated() {
  const scroll = document.getElementById('scrollArea');

  scroll.addEventListener('click', e => {
    // SLS toggle card
    if (e.target.closest('#sls-toggle-card')) {
      state.slsEnabled = !state.slsEnabled;
      render();
      return;
    }
    // Goal chips
    const goalEl = e.target.closest('[data-goal]');
    if (goalEl) {
      toggleGoal(goalEl.dataset.goal);
      return;
    }
    // Flag chips
    const flagEl = e.target.closest('[data-flag]');
    if (flagEl) {
      toggleClientFlag(flagEl.dataset.flag);
      return;
    }
    // Finding toggle
    const toggleEl = e.target.closest('[data-action="toggle"]');
    if (toggleEl) {
      const screen = SCREENS.find(s => s.id === toggleEl.dataset.screen);
      if (screen) toggleFinding(screen.findings[parseInt(toggleEl.dataset.idx)]);
      return;
    }
    // Severity buttons
    const sevEl = e.target.closest('[data-action="severity"]');
    if (sevEl) {
      const screen = SCREENS.find(s => s.id === sevEl.dataset.screen);
      if (screen) setSeverity(screen.findings[parseInt(sevEl.dataset.idx)], sevEl.dataset.sev);
      return;
    }
  });

  scroll.addEventListener('input', e => {
    const noteEl = e.target.closest('[data-action="note"]');
    if (noteEl) {
      const screen = SCREENS.find(s => s.id === noteEl.dataset.screen);
      if (screen) setNote(screen.findings[parseInt(noteEl.dataset.idx)], noteEl.value);
      return;
    }
    const screenNoteEl = e.target.closest('[data-screen-id]');
    if (screenNoteEl) {
      state.screenNotes = state.screenNotes || {};
      state.screenNotes[screenNoteEl.dataset.screenId] = screenNoteEl.value;
    }
  });
}

function switchTab(btn, tabId) {
  document.querySelectorAll('.result-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.result-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + tabId).classList.add('active');
}

function formatResult(text) {
  if (!text) return '<span style="color:var(--ink3)">No output</span>';
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/^#{1,3} (.+)$/gm, '<strong style="color:var(--ink);font-size:15px">$1</strong>')
    .replace(/\n/g, '<br>');
}

function nextStep() {
  // Save client fields on step 0
  if (activeStep === 0) {
    state.client.name = document.getElementById('c_name')?.value || '';
    state.client.date = document.getElementById('c_date')?.value || '';
    state.client.history = document.getElementById('c_hist')?.value || '';
    state.client.goalOther = document.getElementById('c_goal_other')?.value || '';
    state.client.flagOther = document.getElementById('c_flag_other')?.value || '';
    state.client.complaints = document.getElementById('c_complaints')?.value || '';
  }

  if (activeStep === 8) {
    // Generate
    activeStep = 9;
    render();
    generate();
    return;
  }

  activeStep = Math.min(activeStep + 1, 9);
  render();
}

function prevStep() {
  activeStep = Math.max(activeStep - 1, 0);
  render();
}

function startOver() {
  Object.assign(state, {
    step: 0,
    client: { name:'', date:'', history:'', goals:[], goalOther:'', flags:[], flagOther:'', complaints:'' },
    slsEnabled: false,
    screens: {}, screenNotes: {}, result: { corrective:'', flags:'', summary:'' },
  });
  activeStep = 0;
  render();
}

// GENERATE — CALLS CLAUDE WITH EMBEDDED MATRIX DATA
// ═══════════════════════════════════════════════════════════════════

async function generate() {
  const key = localStorage.getItem('apiKey');
  if (!key) { openSettings(); return; }

  // Build findings summary
  const findings = Object.entries(state.screens);
  if (findings.length === 0) {
    state.result = { corrective: 'No findings were recorded.', flags: 'No findings were recorded.', summary: 'Assessment completed with no findings.' };
    render();
    return;
  }

  // Build compact matrix reference — only findings present in this screen
  let matrixRef = '';
  findings.forEach(([name, data]) => {
    const m = MATRIX[name];
    if (m) {
      matrixRef += `\n\n### ${name} [${data.severity.toUpperCase()}]`;
      if (data.notes) matrixRef += `\nClinician notes: ${data.notes}`;
      matrixRef += `\nSMR: ${m.smr}`;
      matrixRef += `\nLengthen: ${m.len}`;
      matrixRef += `\nActivate: ${m.act}`;
      matrixRef += `\nExercises: ${m.ex}`;
      matrixRef += `\nFlags: ${m.fl}`;
    }
  });

  const goalStr = [
    ...(state.client.goals || []),
    ...(state.client.goalOther ? [state.client.goalOther] : []),
  ].join(', ') || 'Not specified';

  const flagStr = [
    ...(state.client.flags || []),
    ...(state.client.flagOther ? [state.client.flagOther] : []),
  ].join(', ') || 'None';

  const hypermobile = state.client.flags.includes('Hypermobility (hEDS/HSD)');

  const systemPrompt = `You are a clinical exercise prescriber for a personal trainer and licensed massage therapist. You generate precise, evidence-informed corrective prescriptions based on movement screen findings and a Clinical Decision Matrix.

SEVERITY DEFINITIONS:
- CLEAN: finding present but mild — note in program, address in warm-up
- COMP (Compensating): moderate — include in accessory block, direct corrective work
- DYSFUNC (Dysfunctional): significant — address before loading that pattern, may require regression

${hypermobile ? `HYPERMOBILITY RULES (NON-NEGOTIABLE — client has hEDS/HSD or suspected hypermobility):
- NEVER prescribe passive end-range stretching
- Prioritise isometric and slow-eccentric exercises only
- Add "HYPERMOBILITY: avoid end-range loading" to all relevant flags
- Replace any passive stretches with active stability work
- Flag every exercise that requires modification
` : ''}

OUTPUT FORMAT — produce exactly three sections separated by === markers:
=== CORRECTIVE PLAN ===
List 4–8 prioritised exercises in kinetic chain order (ankle → hip → thoracic → cervical/shoulder).
For each exercise:
**[Exercise Name]** — [Sets]×[Reps/Duration] — [One coaching cue]

=== PROGRAM DESIGN FLAGS ===
6–10 specific do/don't statements tied to findings. Include severity context.
Format: • [DO/DO NOT/FLAG]: [specific instruction tied to a finding]

=== SCREEN SUMMARY ===
2–3 sentences. Clinical record language. State key findings, primary drivers, and immediate program implications.`;

  const userPrompt = `CLIENT: ${state.client.name || 'Unknown'}
Date: ${state.client.date || 'Today'}
Training history: ${state.client.history || 'Not provided'}
Goals: ${goalStr}
Complaints: ${state.client.complaints || 'None'}
Symptom flags: ${flagStr}

MOVEMENT SCREEN FINDINGS WITH MATRIX DATA:
${matrixRef}

Generate the corrective plan, program design flags, and screen summary using the matrix data above. Use the exact exercise names from the matrix. Weight your corrective priorities by severity — DYSFUNC findings take precedence.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        system: systemPrompt,
        messages: [{ role: 'user', content: userPrompt }],
      }),
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`API ${res.status}: ${err}`);
    }

    const data = await res.json();
    const text = data.content[0].text;

    // Parse sections
    const corrective = (text.match(/=== CORRECTIVE PLAN ===([\s\S]*?)(?:=== PROGRAM DESIGN FLAGS ===|$)/) || ['', ''])[1].trim();
    const flags      = (text.match(/=== PROGRAM DESIGN FLAGS ===([\s\S]*?)(?:=== SCREEN SUMMARY ===|$)/) || ['', ''])[1].trim();
    const summary    = (text.match(/=== SCREEN SUMMARY ===([\s\S]*)$/) || ['', ''])[1].trim();

    state.result = { corrective, flags, summary };
    render();

  } catch (e) {
    state.result = {
      corrective: `Error: ${e.message}`,
      flags: 'Generation failed — check API key in Settings.',
      summary: '',
    };
    render();
  }
}

Phase/context: ${context||'Phase 1 - Foundation'}

FINDINGS (priority order):
${findingsStr}

CORRECTIVE PLAN:
${r.corrective}

PROGRAM FLAGS:
${r.flags}

Build ${programWeeks}-week program. Corrective exercises from findings go into every warm-up and accessory block. Match workout style to preference. Every exercise needs a YouTube URL.`;


  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 8000,
        system: systemPrompt,
        messages: [{ role: 'user', content: userPrompt }],
      }),
    });

    if (!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);

    const data = await res.json();
    let raw = data.content[0].text.trim();
    raw = raw.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/\s*```$/,'');

    status.textContent = 'Building Excel file…';
    const program = JSON.parse(raw);
    buildExcel(program);

    status.textContent = '✓ Program downloaded!';
    btn.disabled = false;
    btn.textContent = 'Generate & Download Excel';

  } catch (e) {
    status.textContent = `Error: ${e.message}. Check console for details.`;

    btn.disabled = false;
    btn.textContent = 'Generate & Download Excel';

}

function buildExcel(prog) {
  const wb = XLSX.utils.book_new();

  const C = {
    TEAL:'1D7A6B', TEAL_L:'E8F5F3', TEAL_M:'2A9D8F',
    NAVY:'1A2E44', NAVY_L:'EBF4FB',
    AMBER:'E6953A', AMBER_L:'FFF6EB',
    GREEN:'2E7D52', GREEN_L:'EAF5EE',
    PURPLE:'6B3FA0', PURPLE_L:'F3EDFA',
    RED:'C0392B', RED_L:'FDE8E8',
    WHITE:'FFFFFF', DARK:'1A1A1A',
    GRAY_L:'F5F5F5', GRAY_M:'CCCCCC',
  };

  // Color lookup — block color key → light variant key
  const LIGHT = { TEAL:'TEAL_L', NAVY:'NAVY_L', AMBER:'AMBER_L', GREEN:'GREEN_L', PURPLE:'PURPLE_L', RED:'RED_L' };

  function mkCell(v, opts={}) {
    const { bold=false, bg=null, fg=null, sz=10, link=null, italic=false } = opts;
    const obj = { v: v ?? '', t: typeof v === 'number' ? 'n' : 's' };
    const fgRgb = fg ? (C[fg]||fg) : (link ? '1A5276' : C.DARK);
    obj.s = {
      font: { name:'Arial', sz, bold, italic, color:{rgb:fgRgb},
              underline: !!link },
      fill: bg ? { patternType:'solid', fgColor:{rgb: C[bg]||bg} } : undefined,
      alignment: { wrapText:true, vertical:'center', horizontal:'left' },
      border: {
        top:{style:'thin',color:{rgb:C.GRAY_M}},
        bottom:{style:'thin',color:{rgb:C.GRAY_M}},
        left:{style:'thin',color:{rgb:C.GRAY_M}},
        right:{style:'thin',color:{rgb:C.GRAY_M}},
      }
    };
    if (link) obj.l = { Target: link };
    return obj;
  }

  function setCell(ws, col, row, v, opts={}) {
    ws[XLSX.utils.encode_cell({c:col, r:row})] = mkCell(v, opts);
  }

  function setRef(ws, maxCol, maxRow) {
    ws['!ref'] = XLSX.utils.encode_range({s:{c:0,r:0}, e:{c:maxCol, r:maxRow}});
  }

  // ── OVERVIEW SHEET ─────────────────────────────────────────────
  function makeOverview() {
    const ws = {};
    let r = 0;
    const COLS = [{wch:22},{wch:58},{wch:14},{wch:12},{wch:12}];

    // Title banner
    for (let ci = 0; ci <= 4; ci++)
      setCell(ws, ci, r, ci===0 ? `${prog.client || 'Client'} — ${prog.phase || prog.weeks+'-Week Program'}` : '', {bold:true, bg:'NAVY', fg:'WHITE', sz:15});
    r++;
    for (let ci = 0; ci <= 4; ci++)
      setCell(ws, ci, r, ci===0 ? `${prog.weeks} Weeks  ·  ${prog.sessions_per_week}×/week  ·  ${prog.workout_style || ''}  ·  ${prog.tab_rationale || ''}` : '', {bg:'TEAL_M', fg:'WHITE', sz:10});
    r += 2;

    // Workout approach
    if (prog.overview?.workout_approach) {
      setCell(ws, 0, r, 'TRAINING APPROACH', {bold:true, bg:'TEAL', fg:'WHITE', sz:10});
      setCell(ws, 1, r, prog.overview.workout_approach, {bg:'TEAL_L', sz:10});
      r++;
      r++;
    }

    // Goals
    setCell(ws, 0, r, 'GOALS', {bold:true, bg:'TEAL', fg:'WHITE', sz:10});
    setCell(ws, 1, r, prog.overview?.goals || '', {bg:'TEAL_L', sz:10});
    r++;

    // Corrective priorities
    if ((prog.overview?.corrective_priorities || []).length) {
      setCell(ws, 0, r, 'CORRECTIVE PRIORITIES', {bold:true, bg:'PURPLE', fg:'WHITE', sz:10});
      setCell(ws, 1, r, '', {bg:'PURPLE', fg:'WHITE', sz:10});
      r++;
      (prog.overview.corrective_priorities).forEach(cp => {
        setCell(ws, 0, r, '⚡', {bg:'PURPLE_L', sz:10, bold:true});
        setCell(ws, 1, r, cp, {bg:'PURPLE_L', sz:10});
        for (let ci=2;ci<=4;ci++) setCell(ws,ci,r,'',{bg:'PURPLE_L'});
        r++;
      });
      r++;
    }

    // Key focuses
    setCell(ws, 0, r, 'KEY FOCUSES', {bold:true, bg:'NAVY', fg:'WHITE', sz:10});
    setCell(ws, 1, r, '', {bg:'NAVY', fg:'WHITE', sz:10});
    r++;
    (prog.overview?.key_focuses || []).forEach(f => {
      setCell(ws, 0, r, '→', {bg:'GRAY_L', sz:10, bold:true});
      setCell(ws, 1, r, f, {bg:'GRAY_L', sz:10});
      for (let ci=2;ci<=4;ci++) setCell(ws,ci,r,'',{bg:'GRAY_L'});
      r++;
    });
    r++;

    // Progression
    setCell(ws, 0, r, 'PROGRESSION', {bold:true, bg:'AMBER', fg:'WHITE', sz:10});
    setCell(ws, 1, r, prog.progression_wave || '', {bg:'AMBER', fg:'WHITE', sz:10});
    r++;
    (prog.overview?.progression_rules || []).forEach(p => {
      setCell(ws, 0, r, '●', {bg:'AMBER_L', sz:10});
      setCell(ws, 1, r, p, {bg:'AMBER_L', sz:10});
      for (let ci=2;ci<=4;ci++) setCell(ws,ci,r,'',{bg:'AMBER_L'});
      r++;
    });
    r++;

    // Contraindications
    setCell(ws, 0, r, 'CONTRAINDICATIONS', {bold:true, bg:'RED', fg:'WHITE', sz:10});
    setCell(ws, 1, r, '', {bg:'RED', fg:'WHITE', sz:10});
    r++;
    (prog.overview?.contraindications || []).forEach(con => {
      setCell(ws, 0, r, '⚠', {bg:'RED_L', sz:10, bold:true});
      setCell(ws, 1, r, con, {bg:'RED_L', sz:10});
      for (let ci=2;ci<=4;ci++) setCell(ws,ci,r,'',{bg:'RED_L'});
      r++;
    });

    ws['!cols'] = COLS;
    ws['!merges'] = [
      {s:{c:0,r:0},e:{c:4,r:0}},
      {s:{c:0,r:1},e:{c:4,r:1}},
    ];
    setRef(ws, 4, r+2);
    return ws;
  }

  // ── SESSION SHEET ──────────────────────────────────────────────
  function makeSession(session) {
    const ws = {};
    let r = 0;
    const HDR_COLS = ['Exercise','Sets','Reps / Duration','Tempo','Rest','Coaching Cue'];
    const COL_W = [{wch:32},{wch:7},{wch:16},{wch:11},{wch:9},{wch:48}];

    // Banner
    const bannerTxt = `${prog.client || 'Client'}  |  ${session.label} — ${session.type}  |  ${prog.phase || prog.weeks+'-Week Program'} · ${prog.weeks} Weeks`;
    for (let ci=0; ci<=5; ci++)
      setCell(ws, ci, r, ci===0 ? bannerTxt : '', {bold:true, bg:'NAVY', fg:'WHITE', sz:12});
    r++;
    // Progression note for this session
    const weekNotes = ['Wk 1: establish technique at moderate load',
                       'Wk 2: +5–10% load or +1 rep per set',
                       'Wk 3: peak week — max load with clean form',
                       'Wk 4: deload — 60% volume, maintain intensity'];
    for (let ci=0; ci<=5; ci++)
      setCell(ws, ci, r, ci===0 ? weekNotes.join('   ·   ') : '', {bg:'TEAL_M', fg:'WHITE', sz:9, italic:true});
    r++;

    // Column headers
    HDR_COLS.forEach((h, ci) => setCell(ws, ci, r, h, {bold:true, bg:'TEAL', fg:'WHITE', sz:9}));
    r++;

    // Blocks
    (session.blocks || []).forEach(block => {
      const bg  = block.color || 'TEAL';
      const bgL = LIGHT[bg] || 'TEAL_L';

      // Block header
      for (let ci=0; ci<=5; ci++)
        setCell(ws, ci, r, ci===0 ? block.name : '', {bold:true, bg, fg:'WHITE', sz:10});
      r++;

      // Exercises
      (block.exercises || []).forEach(ex => {
        const cueText = ex.corrective_for
          ? `${ex.cue || ''} [→ ${ex.corrective_for}]`
          : (ex.cue || '');
        setCell(ws, 0, r, ex.name || '', {bg:bgL, sz:10, link: ex.url||null});
        setCell(ws, 1, r, ex.sets || '', {bg:bgL, sz:10});
        setCell(ws, 2, r, ex.reps || '', {bg:bgL, sz:10});
        setCell(ws, 3, r, ex.tempo || '', {bg:bgL, sz:10});
        setCell(ws, 4, r, ex.rest || '', {bg:bgL, sz:10});
        setCell(ws, 5, r, cueText, {bg:'WHITE', sz:10});
        r++;
      });
      r++; // spacer
    });

    ws['!cols'] = COL_W;
    ws['!merges'] = [
      {s:{c:0,r:0},e:{c:5,r:0}},
      {s:{c:0,r:1},e:{c:5,r:1}},
    ];
    setRef(ws, 5, r+2);
    return ws;
  }

  // ── Assemble ───────────────────────────────────────────────────
  XLSX.utils.book_append_sheet(wb, makeOverview(), 'Program Overview');
  (prog.sessions || []).forEach(session => {
    const tabName = (session.label || 'Session').substring(0, 31); // Excel tab name limit
    XLSX.utils.book_append_sheet(wb, makeSession(session), tabName);
  });

  const filename = `${(prog.client||'Program').replace(/[^a-zA-Z0-9]/g,'_')}_4Week_Program.xlsx`;
  XLSX.writeFile(wb, filename);
}
  const key = localStorage.getItem('apiKey');
  if (!key) { openSettings(); return; }

  const equipment = document.getElementById('prog-equipment')?.value || 'Full commercial gym';
  const context   = document.getElementById('prog-context')?.value || '';
  const btn       = document.getElementById('gen-prog-btn');
  const status    = document.getElementById('prog-status');

  btn.disabled = true;
  btn.textContent = 'Generating…';
  status.style.display = 'block';
  status.textContent = 'Calling Claude to build your program…';

  const c = state.client;
  const r = state.result;

  const goalStr = [...(c.goals||[]), ...(c.goalOther?[c.goalOther]:[])].join(', ') || 'General fitness';
  const flagStr = [...(c.flags||[]), ...(c.flagOther?[c.flagOther]:[])].join(', ') || 'None';

  const findings = Object.entries(state.screens).map(([name, data]) => {
    const sev = data.severity === 'clean' ? 'Mild' : data.severity === 'comp' ? 'Moderate' : 'Significant';
    return `${name} (${sev})${data.notes ? ': ' + data.notes : ''}`;
  }).join('; ') || 'None';

  // Determine session labels based on count
  const sessionLabels = programSessions <= 2 ? ['Day A','Day B']
    : programSessions === 3 ? ['Day A','Day B','Day C']
    : programSessions === 4 ? ['Day A','Day B','Day C','Day D']
    : ['Day A','Day B','Day C','Day D','Day E'];
  const sessionTypes = programSessions <= 2
    ? ['Full Body A','Full Body B']
    : programSessions === 3
    ? ['Lower / Hinge focus','Upper / Push-Pull focus','Full Body / Athletic']
    : ['Lower A (Hinge)','Upper A (Push)','Lower B (Squat)','Upper B (Pull)'];

  const systemPrompt = `You are an expert strength and conditioning coach building a 4-week training program. You must return ONLY valid JSON — no prose, no markdown, no explanation. Your JSON will be parsed directly.

The program format follows this exact structure:

{
  "client": "string",
  "phase": "string",
  "weeks": 4,
  "sessions_per_week": number,
  "overview": {
    "goals": "string",
    "key_focuses": ["string"],
    "progression_rules": ["string"],
    "contraindications": ["string"]
  },
  "sessions": [
    {
      "label": "Day A",
      "type": "Lower / Hinge Focus",
      "blocks": [
        {
          "name": "Warm-Up / Activation",
          "color": "TEAL",
          "exercises": [
            {
              "name": "Exercise Name",
              "sets": "2",
              "reps": "10",
              "tempo": "2-0-2-0",
              "rest": "30s",
              "cue": "One concise coaching cue",
              "url": "https://www.youtube.com/..."
            }
          ]
        },
        {
          "name": "Main Work",
          "color": "NAVY",
          "exercises": [...]
        },
        {
          "name": "Corrective / Accessory",
          "color": "AMBER",
          "exercises": [...]
        },
        {
          "name": "Cool-Down",
          "color": "GREEN",
          "exercises": [...]
        }
      ]
    }
  ]
}

RULES:
- color must be one of: TEAL, NAVY, AMBER, GREEN, PURPLE, RED
- Every exercise must have a real YouTube URL from a reputable source (Jeff Nippard, Squat University, Alan Thrall, e3rehab, or similar)
- Use EXACT exercise names from the client's corrective plan where applicable
- Warm-Up block: 4–6 exercises from the corrective plan findings
- Main Work block: 4–6 compound exercises matching goals and equipment
- Corrective/Accessory block: 3–4 exercises addressing specific findings
- Cool-Down block: 3–4 stretches or breathing exercises
- Progression rule: each week increases load or reps by a specific amount
- Include contraindications as explicit do-not-do statements
${state.client.flags.includes('Hypermobility (hEDS/HSD)') ? '- CLIENT HAS HYPERMOBILITY: NO passive end-range stretching, isometrics and slow eccentrics only' : ''}

Return ONLY the JSON object. Nothing else.`;

  const userPrompt = `CLIENT: ${c.name || 'Client'}
Goals: ${goalStr}
Symptom flags: ${flagStr}
Training history: ${c.history || 'Not provided'}
Equipment: ${equipment}
Sessions/week: ${programSessions} (${sessionLabels.join(', ')})
Session length: ${programDuration}
Phase/context: ${context || 'Phase 1 — Foundation'}

MOVEMENT SCREEN FINDINGS: ${findings}

CORRECTIVE PLAN FROM ASSESSMENT:
${r.corrective}

PROGRAM DESIGN FLAGS:
${r.flags}

Build a 4-week program with ${programSessions} sessions/week: ${sessionLabels.map((l,i) => l+' = '+sessionTypes[i]).join(', ')}.
Integrate the corrective exercises into warm-ups and accessory blocks. Main work must address the client's primary goals. Every exercise needs a YouTube URL.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 8000,
        system: systemPrompt,
        messages: [{ role: 'user', content: userPrompt }],
      }),
    });

    if (!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);

    const data = await res.json();
    let raw = data.content[0].text.trim();
    // Strip any accidental markdown fences
    raw = raw.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/\s*```$/,'');

    status.textContent = 'Building Excel file…';
    const program = JSON.parse(raw);
    buildExcel(program);

    status.textContent = '✓ Program downloaded!';
    btn.disabled = false;
    btn.textContent = 'Generate & Download Excel';

  } catch (e) {
    status.textContent = `Error: ${e.message}`;
    btn.disabled = false;
    btn.textContent = 'Generate & Download Excel';
  }
}

state.client.date = new Date().toISOString().slice(0, 10);
render();
